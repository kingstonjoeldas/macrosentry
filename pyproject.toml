[project]
name = "macrosentry"
version = "0.1.0"
description = "Autonomous Fed/market surveillance pipeline with self-evaluating predictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-huggingface>=0.0.1",
    "sentence-transformers>=2.2.0",
    "supabase>=2.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pytz>=2024.1",
]

[project.scripts]
macrosentry = "macrosentry.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
